name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - name: Create (or reuse) release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Build $TAG" \
              --notes "Build automático do commit ${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --name "VideoDownloader-Mac" video_downloader.py
      - name: Zip .app
        run: |
          if [ -d "dist/VideoDownloader-Mac.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/VideoDownloader-Mac.app" "dist/VideoDownloader-Mac.zip"
          else
            ditto -c -k "dist/VideoDownloader-Mac" "dist/VideoDownloader-Mac.zip"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            "dist/VideoDownloader-Mac.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download ffmpeg
        run: |
          curl -L https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
          tar -xf ffmpeg.zip
          copy ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe ffmpeg.exe
        shell: cmd
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --add-binary "ffmpeg.exe;." --name "VideoDownloader-Windows" video_downloader.py
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" `
            "dist/VideoDownloader-Windows.exe" `
            --repo "$env:GITHUB_REPOSITORY" --clobber
        shell: pwsh
