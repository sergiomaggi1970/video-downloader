name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name "VideoDownloader-Mac" video_downloader.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Mac
          path: dist/VideoDownloader-Mac

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name "VideoDownloader-Windows" video_downloader.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows
          path: dist/VideoDownloader-Windows.exe
